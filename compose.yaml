services:
  app:
    build: .
    restart: unless-stopped
    expose:
      - "8000"
    read_only: true
    volumes:
      - contact_data:/app/data
    environment:
      EKONOMATICA_CONTACT_DB: /app/data/contatos.sqlite3
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      AI_DAILY_CALL_LIMIT: ${AI_DAILY_CALL_LIMIT:-60}
      AI_SESSION_CALL_LIMIT: ${AI_SESSION_CALL_LIMIT:-12}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      EKONOMATICA_ADMIN_TOKEN: ${EKONOMATICA_ADMIN_TOKEN:-}
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Configure o dominio em .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  contact_data:
  caddy_data:
  caddy_config:
