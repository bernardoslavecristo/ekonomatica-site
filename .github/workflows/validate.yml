name: Ekonomatica | Validar site e prévia 3D
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verificar JavaScript
        run: |
          set -euo pipefail
          for file in *.js; do
            echo "Validando $file"
            node --check "$file"
          done
      - name: Verificar arquivos essenciais da experiencia
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for page in ("index.html", "experiencia-3d.html"):
              html = Path(page).read_text(encoding="utf8")
              assert "<html" in html and "</html>" in html, page
              for name in re.findall(r'(?:href|src)="([^"]+)"', html):
                  if name.startswith(("https:", "http:", "mailto:", "#")):
                      continue
                  local = name.split("#")[0].split("?")[0]
                  if local and not Path(local).exists():
                      raise RuntimeError(f"{page}: arquivo ausente {local}")
          for source in ("experiencia-3d.css","experiencia-3d.js","contact-widget.js","ai-chat.js"):
              assert Path(source).stat().st_size > 100, source
          print("Arquivos da experiencia e links locais: OK")
          PY
      - name: Verificar todas as páginas, âncoras e scripts inline
        run: python3 scripts/check_static.py
      - name: Verificar cenários e conservação do planejador de colheita
        run: node --test tests/colheita.test.cjs
      - name: Verificar sintaxe da API
        run: python3 -m compileall -q backend
      - name: Confirmar ausencia de secrets versionados
        run: |
          if git ls-files | grep -E '(^|/)\.env$|(^|/).*\.sqlite3$'; then
            echo "ERRO: segredo ou banco de dados versionado"
            exit 1
          fi
          echo "Nenhum arquivo .env ou banco versionado."
